<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Knowledge</title><style>body{font-family:system-ui;margin:0;background:#0d1117;color:#e6edf3}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:20px;margin-bottom:16px}textarea{width:100%;min-height:110px;background:#0d1117;color:#fff;border:1px solid #30363d;border-radius:8px;padding:12px;box-sizing:border-box}button,select{padding:10px 16px;border:1px solid #30363d;border-radius:8px}select{width:100%;background:#0d1117;color:#fff;min-height:44px}button{cursor:pointer}.scope{display:grid;gap:10px;margin-bottom:16px}.hint,.muted{color:#8b949e}.source{padding:8px 0;border-bottom:1px solid #30363d}pre{white-space:pre-wrap}</style></head><body><div class="wrap"><div class="card"><b>{{ request.user.username }}</b> · {% if profile %}{{ profile.get_role_display }}{% endif %} · <a href="/accounts/logout/">Sair</a></div><div class="card"><h2>Assistente Técnico</h2><div class="scope"><label for="scopeMode">Escopo da consulta</label><select id="scopeMode"><option value="all">Todos os sistemas autorizados</option><option value="selected">Sistemas selecionados</option></select><label for="projects">Sistemas disponíveis</label><select id="projects" multiple size="{% if projects|length > 6 %}6{% else %}{{ projects|length|default:1 }}{% endif %}">{% for p in projects %}<option value="{{ p.id }}">{{ p.path_with_namespace }} ({{ p.provider }})</option>{% endfor %}</select><div class="hint">Analistas veem todos os projetos habilitados. Desenvolvedores veem somente os projetos atribuídos. Use Ctrl/Cmd para selecionar mais de um.</div></div><textarea id="q" placeholder="Pergunte sobre os sistemas autorizados..."></textarea><p><button id="ask">Consultar</button> <span id="status" class="muted"></span></p></div><div class="card"><h3>Resposta</h3><pre id="answer">—</pre></div><div class="card"><h3>Fontes</h3><div id="sources" class="muted">—</div></div></div><script>
function cookie(n){return document.cookie.split('; ').find(x=>x.startsWith(n+'='))?.split('=')[1]||''}
function renderSources(xs){const el=document.getElementById('sources');el.textContent='';if(!xs.length){el.textContent='—';return}for(const s of xs){const d=document.createElement('div');d.className='source';d.textContent=`${s.project} · ${s.title} · sim=${s.similarity}`;el.appendChild(d)}}
function selectedProjects(){return Array.from(document.getElementById('projects').selectedOptions).map(o=>Number(o.value))}
document.getElementById('scopeMode').onchange=()=>{document.getElementById('projects').disabled=document.getElementById('scopeMode').value==='all'};document.getElementById('scopeMode').dispatchEvent(new Event('change'));
document.getElementById('ask').onclick=async()=>{const q=document.getElementById('q').value.trim(),a=document.getElementById('answer'),st=document.getElementById('status'),b=document.getElementById('ask'),mode=document.getElementById('scopeMode').value,ids=selectedProjects();if(!q)return;if(mode==='selected'&&!ids.length){st.textContent='Selecione pelo menos um sistema.';return}b.disabled=true;a.textContent='';st.textContent='Consultando via MCP...';try{const r=await fetch('/api/chat/stream/',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':decodeURIComponent(cookie('csrftoken'))},body:JSON.stringify({question:q,scope:{mode:mode,project_ids:ids}})});if(!r.ok){let msg='HTTP '+r.status;try{const d=await r.json();msg=d.detail||msg}catch{}throw new Error(msg)}const rd=r.body.getReader(),dec=new TextDecoder();let buf='';while(true){const {value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let lines=buf.split('\n');buf=lines.pop()||'';for(const line of lines){if(!line.trim())continue;const e=JSON.parse(line);if(e.event==='meta'){renderSources(e.sources||[]);st.textContent='Gerando resposta...'}else if(e.event==='delta'){a.textContent+=e.text||'';st.textContent='Recebendo resposta...'}else if(e.event==='error')throw new Error(e.message||'erro');else if(e.event==='done')st.textContent='Concluído.'}}}catch(e){a.textContent='Erro: '+e.message;st.textContent='Falha.'}finally{b.disabled=false}}
</script></body></html>
