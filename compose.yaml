services:
 postgres:
  image: pgvector/pgvector:pg16
  environment: {POSTGRES_DB: ai_knowledge, POSTGRES_USER: ai_knowledge, POSTGRES_PASSWORD: CHANGE_ME}
  volumes: [pgdata:/var/lib/postgresql/data]
  healthcheck: {test: ["CMD-SHELL","pg_isready -U ai_knowledge -d ai_knowledge"], interval: 5s, timeout: 3s, retries: 20}
  networks: [backend]
 redis:
  image: redis:7-alpine
  command: ["redis-server","--appendonly","yes"]
  volumes: [redisdata:/data]
  networks: [backend]
 ollama:
  image: ollama/ollama:latest
  environment: {OLLAMA_HOST: "0.0.0.0:11434", OLLAMA_NUM_PARALLEL: "1", OLLAMA_MAX_LOADED_MODELS: "1", OLLAMA_KEEP_ALIVE: "30m"}
  volumes: [ollama:/root/.ollama]
  networks: [backend]
 presidio-analyzer:
  image: ghcr.io/data-privacy-stack/presidio-analyzer:latest
  networks: [backend]
 web:
  build: .
  env_file: .env
  command: ["sh","-c","python manage.py migrate && python manage.py collectstatic --noinput && uvicorn config.asgi:application --host 0.0.0.0 --port 8080 --proxy-headers"]
  depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_started}, ollama: {condition: service_started}}
  ports: ["8080:8080"]
  networks: [backend]
 worker:
  build: .
  env_file: .env
  command: ["celery","-A","config","worker","-l","INFO","--concurrency=2"]
  depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_started}}
  networks: [backend]
 beat:
  build: .
  env_file: .env
  command: ["celery","-A","config","beat","-l","INFO"]
  depends_on: [redis]
  networks: [backend]
 mcp-knowledge:
  build: .
  env_file: .env
  command: ["python","-m","mcp_servers.knowledge.server"]
  environment: {MCP_TRANSPORT: streamable-http}
  depends_on: {postgres: {condition: service_healthy}, ollama: {condition: service_started}}
  expose: ["8001"]
  networks: [backend]
volumes: {pgdata: {}, redisdata: {}, ollama: {}}
networks: {backend: {driver: bridge}}
